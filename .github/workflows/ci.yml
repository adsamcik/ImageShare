name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant gradlew execute
        run: chmod +x ./gradlew

      - name: Assemble + unit tests
        run: ./gradlew --no-daemon --console=plain "-Pimageshare.skipNativeJpegBuild=true" "-Pimageshare.skipNativeAvifBuild=true" :app:assembleDebug :app:testDebugUnitTest :sdk:imageshare-api:assembleDebug :sdk:imageshare-api:testDebugUnitTest :samples:minimal-host:assembleDebug :samples:picker-host:assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon --console=plain "-Pimageshare.skipNativeJpegBuild=true" "-Pimageshare.skipNativeAvifBuild=true" :app:lintDebug :sdk:imageshare-api:lintDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            sdk/imageshare-api/build/reports/tests/
            app/build/reports/lint-results-debug.html
            sdk/imageshare-api/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore
