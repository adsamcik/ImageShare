name: Publish GitHub release

run-name: Publish GitHub release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: yes | sdkmanager 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.IMAGESHARE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/imageshare-release.jks"

      - name: Test, lint, and build signed APK
        env:
          IMAGESHARE_KEYSTORE_PATH: ${{ runner.temp }}/imageshare-release.jks
          IMAGESHARE_KEYSTORE_PASSWORD: ${{ secrets.IMAGESHARE_KEYSTORE_PASSWORD }}
          IMAGESHARE_KEY_ALIAS: ${{ secrets.IMAGESHARE_KEY_ALIAS }}
          IMAGESHARE_KEY_PASSWORD: ${{ secrets.IMAGESHARE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --console=plain
          :app:testDebugUnitTest
          :app:lintRelease
          :app:assembleRelease

      - name: Verify APK signature and write checksum
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/v0.1.0.md
          prerelease: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          fail_on_unmatched_files: true

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/imageshare-release.jks"
