# Manual artifact builder only. This workflow has no Google Play credentials and cannot publish.
name: Build Play bundle (manual)

run-name: Manual Play bundle by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify + build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Google Play metadata
        run: python3 tools/verify_play_readiness.py

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.IMAGESHARE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/imageshare-upload.jks"

      - name: Test, lint, and build signed bundle
        env:
          IMAGESHARE_KEYSTORE_PATH: ${{ runner.temp }}/imageshare-upload.jks
          IMAGESHARE_KEYSTORE_PASSWORD: ${{ secrets.IMAGESHARE_KEYSTORE_PASSWORD }}
          IMAGESHARE_KEY_ALIAS: ${{ secrets.IMAGESHARE_KEY_ALIAS }}
          IMAGESHARE_KEY_PASSWORD: ${{ secrets.IMAGESHARE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --console=plain
          :app:testDebugUnitTest
          :app:lintRelease
          :app:bundleRelease

      - name: Verify bundle signature and checksum
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/bundle/release/app-release.aab > app/build/outputs/bundle/release/app-release.aab.sha256

      - name: Store bundle as GitHub artifact for manual Play upload
        uses: actions/upload-artifact@v4
        with:
          name: imageshare-play-v1.0.0-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/app-release.aab.sha256
            app/build/reports/lint-results-release.html
          retention-days: 14
          if-no-files-found: error

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/imageshare-upload.jks"
